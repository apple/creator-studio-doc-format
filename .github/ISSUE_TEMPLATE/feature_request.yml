name: "🌱 Feature Request"
description: Suggest a feature or improvement for Creator Studio Document Format
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        We read feature requests to understand how people use the library. We keep the
        API surface intentionally focused, so we don't accept every request.

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem does this solve? What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: additional
    attributes:
      label: Additional context
